# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml', encoding='utf-8'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm.
#   b) Theo nhân viên, m = 75: DE = 2,48; n = 3.103 mỗi nhóm; 42 người mỗi nhóm, tổng 84 > 40 nên không đủ người.
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa < 20 / 0,02 = 1.000 < 1.251 nên không đạt.
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng tối đa < 6 / 0,02 = 300.
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: m ≥ 299 yêu cầu mỗi người; DE = 6,96; n hiệu dụng = 859,2.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia theo nhân viên 20 + 20:
#   1. Đối chứng chạy cùng thời gian: có, 20 nhân viên đối chứng làm cùng tuần và cùng depot với nhóm trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: ngẫu nhiên bằng code với seed 13 ghi trước, phân tầng theo depot; phần dư ở depot lẻ người bốc thăm để tổng đúng 20 + 20.
#   3. Ảnh hưởng gián tiếp và cách giảm: có rủi ro chia sẻ câu trả lời trong depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: có, chốt trong file này trước ngày bắt đầu 2026-12-07.
#   5. Ít nhất 20 cụm mỗi nhóm: có, đúng 20 cụm mỗi nhóm.
#
# Đánh đổi đã chấp nhận: chỉ đủ mẫu cho mức chênh 6 điểm. Nếu tác động thật là 5 điểm, power chỉ còn 0,64.
# Lịch: bước 0.50 phải chạy 14 ngày, vì 1 tuần chỉ được 215 yêu cầu/người (< 299); 14 ngày được 430 yêu cầu/người.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Toàn mẫu 4,25% (51/1.200); phạm vi pilot 3,97% (39/982). Ngưỡng 3% sẽ dừng pilot ngay, nên dùng chênh +2 điểm so với đối chứng và trần 6%.
#   Với 4 nhân viên (859 yêu cầu/7 ngày), xác suất vượt trần 6% khi tỉ lệ thật là 3,97% chỉ 0,13%.

